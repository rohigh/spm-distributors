<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - SPM Distributors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: #f4f7f6; padding: 20px; }
    .admin-container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    
    #login-screen { text-align: center; padding: 100px 20px; }
    #login-screen input { padding: 10px; font-size: 16px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; font-weight: 600; color: #555; }
    .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }
    
    .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px; }
    .btn-approve { background: #28a745; color: white; }
    .btn-reject { background: #dc3545; color: white; }
    .btn-view { background: #007bff; color: white; text-decoration: none; display: inline-block; }

    .delivery-days-section { margin-top: 40px; padding: 20px; background: #f8f9fa; border-radius: 8px; }
    .day-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h2>Admin Login</h2>
    <button class="btn-primary" onclick="loginWithGoogle()" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto; background-color: #fff; color: #333; border: 1px solid #ccc;">
      <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>

  <div class="admin-container" id="admin-dashboard" style="display: none;">
    <div class="admin-header">
      <h2>SPM Admin Dashboard</h2>
      <div>
        <a href="index.html" style="color: #666; text-decoration: none; margin-right: 15px;">&larr; Back to Store</a>
        <button class="btn-action btn-reject" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Orders Section -->
    <h3>Recent Orders</h3>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="orders-tbody">
        <tr><td colspan="6" style="text-align: center;">Loading orders...</td></tr>
      </tbody>
    </table>

    <!-- Delivery Days Settings -->
    <div class="delivery-days-section">
      <h3>🚚 Manage Delivery Days</h3>
      <p style="color: #666; font-size: 14px; margin-bottom: 15px;">Turn delivery on or off for specific days. Changes apply immediately for all customers.</p>
      <div id="days-container">
        <!-- Rendered by JS -->
      </div>
      <button class="btn-primary" style="margin-top: 15px;" onclick="saveDeliveryDays()">Save Delivery Days</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
